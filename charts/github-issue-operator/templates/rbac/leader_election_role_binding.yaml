apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "github-issue-operator.labels" . | nindent 4 }}
  name: {{ include "github-issue-operator.name" . }}-leader-election-rolebinding
  namespace: {{ include "github-issue-operator.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-issue-operator.name" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "github-issue-operator.serviceAccountName" . }}
  namespace: {{ include "github-issue-operator.namespace" . }}
