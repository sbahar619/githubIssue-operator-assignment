---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "github-issue-operator.name" . }}-manager-role
  labels:
    {{- include "github-issue-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - github.shahaf.com
  resources:
  - githubissues
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - github.shahaf.com
  resources:
  - githubissues/finalizers
  verbs:
  - update
- apiGroups:
  - github.shahaf.com
  resources:
  - githubissues/status
  verbs:
  - get
  - patch
  - update
