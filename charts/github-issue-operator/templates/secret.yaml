apiVersion: v1
kind: Secret
metadata:
  name: {{ include "github-issue-operator.secretName" . }}
  namespace: {{ include "github-issue-operator.namespace" . }}
  labels:
    {{- include "github-issue-operator.labels" . | nindent 4 }}
  {{- if not .Values.github.token }}
  annotations:
    # This secret was created without a token value - please update it with a valid GitHub token
    github-issue-operator/token-status: "empty"
  {{- end }}
type: Opaque
stringData:
  token: {{ .Values.github.token | default "" | quote }}
