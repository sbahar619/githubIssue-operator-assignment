name: 'Setup Go Environment'
description: 'Sets up Go with caching'

inputs:
  go-version:
    description: 'Go version to use'
    required: true
    default: '1.24'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: '**/go.sum'