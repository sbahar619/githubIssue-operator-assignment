name: Build

on:
  push:
    branches: [ main, develop, github-issue-operator ]
  pull_request:
    branches: [ main, develop, github-issue-operator ]

env:
  GO_VERSION: '1.24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: make build