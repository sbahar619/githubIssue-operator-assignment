name: E2E Tests

on:
  pull_request:
    branches: [ main, develop, github-issue-operator ]
  push:
    branches: [ main, develop, github-issue-operator ]

env:
  GO_VERSION: '1.24'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: ./.github/actions/setup-go
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Create Kind cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: e2e-test
        
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'
        
    - name: Verify cluster readiness
      run: |
        echo "=== Cluster ready check ==="
        echo "Kubectl version:"
        kubectl version --client || true
        echo "Available clusters:"
        kind get clusters || true
        echo "Current context:"
        kubectl config current-context || true
        echo "Nodes:"
        kubectl get nodes || true
        echo "Namespaces:"
        kubectl get namespaces || true
        echo "=== Waiting for cluster to be fully ready ==="
        kubectl wait --for=condition=Ready nodes --all --timeout=60s || true
      
    - name: Build operator image
      run: |
        echo "=== Building operator image ==="
        make docker-build IMG=localhost/test-operator:latest
        echo "=== Verifying built image ==="
        docker images localhost/test-operator:latest
        
    - name: Load image to Kind
      run: |
        echo "=== Docker images before loading ==="
        docker images | grep test-operator || echo "No test-operator images found"
        echo "=== Loading image to Kind ==="
        kind load docker-image localhost/test-operator:latest --name e2e-test
        echo "=== Image loaded successfully ==="
        
    - name: Deploy operator with Helm
      run: |
        echo "Deploying operator with Helm..."
        echo "GitHub token configured: $([ -n "$GITHUB_TOKEN" ] && echo 'YES' || echo 'NO')"
        
        helm install github-issue-operator ./charts/github-issue-operator \
          --values ./charts/github-issue-operator/values-e2e.yaml \
          --set github.token="$GITHUB_TOKEN" \
          --wait --timeout=120s
        
        echo "=== Deployment completed, checking resources ==="
        kubectl get all -n github-issue-operator-system
        echo "=== CRD Status ==="
        kubectl get crd githubissues.github.shahaf.com
      env:
        GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
        
        
    - name: Run E2E tests
      run: |
        make test-e2e
        
    - name: Debug on failure
      if: failure()
      run: |
        echo "=== Cluster info ==="
        kubectl cluster-info || true
        echo "=== Node status ==="
        kubectl get nodes || true
        echo "=== All namespaces ==="
        kubectl get ns || true
        echo "=== Pod status ==="
        kubectl get pods -A || true
        echo "=== Deployment status ==="
        kubectl get deployments -A || true
        echo "=== Service status ==="
        kubectl get services -A || true
        echo "=== CRD status ==="
        kubectl get crd || true
        echo "=== Controller logs ==="
        kubectl logs -n github-issue-operator-system deployment/github-issue-operator-controller-manager --tail=50 || true
        echo "=== Events ==="
        kubectl get events -A --sort-by='.lastTimestamp' || true
        echo "=== Helm releases ==="
        helm list -A || true
