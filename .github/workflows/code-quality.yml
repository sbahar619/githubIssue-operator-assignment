name: Code Quality

on:
  push:
    branches: [ main, develop, github-issue-operator ]
  pull_request:
    branches: [ main, develop, github-issue-operator ]

env:
  GO_VERSION: '1.24'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format check
        run: |
          make fmt
          git diff --exit-code

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
    