---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Chart.Name }}-manager-role
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - github.shahaf.com
  resources:
  - githubissues
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - github.shahaf.com
  resources:
  - githubissues/finalizers
  verbs:
  - update
- apiGroups:
  - github.shahaf.com
  resources:
  - githubissues/status
  verbs:
  - get
  - patch
  - update
