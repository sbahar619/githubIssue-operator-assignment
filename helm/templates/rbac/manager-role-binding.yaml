apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    {{- include "github-issue-operator.labels" . | nindent 4 }}
  name: {{ include "github-issue-operator.name" . }}-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "github-issue-operator.name" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "github-issue-operator.serviceAccountName" . }}
  namespace: {{ include "github-issue-operator.namespace" . }}
